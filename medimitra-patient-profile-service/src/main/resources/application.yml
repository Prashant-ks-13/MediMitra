server:
  port: 8082

spring:
  application:
    name: medimitra-patient-profile-service
  datasource:
    url: jdbc:postgresql://localhost:5432/medimitra_patient_profile
    username: medimitra
    password: medimitra
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

medimitra:
  # Placeholder cell config; each deployed cell overrides these for its own Keycloak realm.
  security:
    issuer: https://auth.in.medimitra.dev
    jwks-uri: https://auth.in.medimitra.dev/.well-known/jwks.json
    audience: medimitra-patient-profile
    region: IN
    service-token:
      token-uri: https://auth.in.medimitra.dev/realms/medimitra-in/protocol/openid-connect/token
      client-id: patient-profile-service
      client-secret: changeme
    consent:
      base-url: http://localhost:8083

  messaging:
    relay:
      fixed-delay-ms: 2000

  patient-profile:
    topics:
      user-registered: medimitra.in.user.registered.v1
      user-registered-group: medimitra-patient-profile-user-registered

management:
  endpoints:
    web:
      exposure:
        include: health
